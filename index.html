<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JKJF Documentation - Aug 3 to Aug 15</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2563EB;
            --secondary: #0D9488;
            --accent: #F59E0B;
            --bg-color: #F4F5F7;
            --text-color: #1E293B;
            --card-bg: #FFFFFF;
            --card-border: #E2E8F0;
            --header-bg: transparent;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --drawer-bg: #FFFFFF;
            --overlay-bg: rgba(0, 0, 0, 0.4);
            --btn-bg: #E2E8F0;
            --btn-hover: #CBD5E1;
            --header-glass: rgba(255, 255, 255, 0.82);
            --accent-gradient-1: linear-gradient(135deg, var(--primary) 0%, #1D4ED8 100%);
            --accent-gradient-2: linear-gradient(135deg, var(--secondary) 0%, #0F766E 100%);
        }

        [data-theme="dark"] {
            --primary: #3B82F6;
            --secondary: #14B8A6;
            --accent: #FBBF24;
            --bg-color: #070C1B;
            --text-color: #F1F5F9;
            --card-bg: #101A30;
            --card-border: #16223C;
            --header-bg: transparent;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            --drawer-bg: #101A30;
            --overlay-bg: rgba(0, 0, 0, 0.6);
            --btn-bg: #16223C;
            --btn-hover: #2C3B5C;
            --header-glass: rgba(7, 12, 27, 0.82);
            --accent-gradient-1: linear-gradient(135deg, var(--primary) 0%, #2563EB 100%);
            --accent-gradient-2: linear-gradient(135deg, var(--secondary) 0%, #0D9488 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            padding: 100px 24px 60px 24px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            position: relative;
            overflow-x: hidden;
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.35;
            pointer-events: none;
            animation: float 14s ease-in-out infinite;
        }
        [data-theme="dark"] .blob { opacity: 0.28; }

        .blob-1 { width: 340px; height: 340px; top: -120px; right: -100px; background: var(--primary); }
        .blob-2 { width: 300px; height: 300px; bottom: -100px; left: -100px; background: var(--secondary); animation-delay: -5s; }
        .blob-3 { width: 220px; height: 220px; bottom: 20%; right: -80px; background: var(--accent); opacity: 0.22; animation-delay: -9s; }
        [data-theme="dark"] .blob-3 { opacity: 0.16; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-16px, 22px) scale(1.06); }
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* ---------- HEADER (matches jobs.html / personnel.html) ---------- */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 30px;
            background-color: var(--header-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 90;
            border-bottom: 1px solid transparent;
            transition: background-color 0.25s ease, border-color 0.25s ease, backdrop-filter 0.25s ease;
        }

        .site-header.scrolled {
            background-color: var(--header-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--card-border);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .site-brand {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 23px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--text-color) 0%, var(--text-color) 60%, var(--primary) 130%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.03em;
            text-decoration: none;
        }

        .site-brand .dot {
            color: var(--accent);
            -webkit-text-fill-color: var(--accent);
            font-size: 24px;
            display: inline-block;
            animation: pulse-dot 2.4s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.35); opacity: 0.7; }
        }
        }

        .burger-btn {
            width: 42px;
            height: 42px;
            background-color: var(--btn-bg);
            border: none;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-color);
            transition: background-color 0.2s ease;
        }

        .burger-btn:hover {
            background-color: var(--btn-hover);
        }

        .burger-btn svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-btn {
            background: var(--accent-gradient-1);
            color: #fff;
            border: none;
            padding: 0.55rem 1rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .header-btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        /* On narrow screens let the header wrap to two rows instead of
           squeezing the logo text and the button into each other. */
        @media (max-width: 480px) {
            .site-header {
                height: auto;
                flex-wrap: wrap;
                row-gap: 10px;
                padding: 14px 20px;
            }
            .site-brand { font-size: 1.15rem; }
            .header-right { width: 100%; justify-content: flex-end; }
            .header-btn { font-size: 0.78rem; padding: 0.5rem 0.85rem; }
            body { padding-top: 128px; }
        }

        /* ---------- PAGE TITLE ---------- */
        .page-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(26px, 5vw, 36px);
            font-weight: 800;
            text-align: center;
            letter-spacing: -0.02em;
            color: var(--text-color);
            margin-bottom: 8px;
        }

        .page-subtitle {
            text-align: center;
            color: var(--secondary);
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 40px;
        }

        /* ---------- DAY GRID ---------- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .day-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 18px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.3s ease,
                        border-color 0.3s ease;
        }

        .day-box:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px);
        }

        .day-title {
            background: var(--accent-gradient-1);
            color: #fff;
            padding: 10px;
            border-radius: 14px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            margin-bottom: 14px;
            font-size: 15px;
            letter-spacing: 0.01em;
        }

        .upload-area {
            width: 100%;
            height: 190px;
            border: 2px dashed var(--card-border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            background: var(--bg-color);
            transition: border-color 0.2s ease;
        }

        .upload-area:hover {
            border-color: var(--secondary);
        }

        .upload-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .upload-text {
            color: var(--secondary);
            font-size: 13px;
            font-weight: 600;
            padding: 0 12px;
        }

        .upload-area input {
            display: none;
        }

        .caption {
            width: 100%;
            margin-top: 12px;
            padding: 10px 12px;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
        }

        .caption:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        .btn-save {
            display: block;
            margin: 40px auto 0;
            padding: 15px 34px;
            background: var(--accent-gradient-2);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
            box-shadow: var(--shadow-sm);
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        /* ---------- BURGER DRAWER (matches chooserole.html exactly) ---------- */
        .menu-drawer {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100%;
            background-color: var(--drawer-bg);
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.2);
            z-index: 200;
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-drawer.open {
            left: 0;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--overlay-bg);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .menu-items {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-radius: 12px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: transparent;
            border: none;
            width: 100%;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .menu-item:hover {
            background-color: var(--btn-bg);
        }

        .menu-item svg {
            stroke: var(--text-color);
            transition: stroke 0.2s ease;
        }

        .theme-toggle-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toggle-switch {
            width: 44px;
            height: 24px;
            background-color: var(--btn-bg);
            border-radius: 20px;
            position: relative;
            transition: background-color 0.3s ease;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: #FFFFFF;
            transition: transform 0.3s ease;
        }

        [data-theme="dark"] .toggle-switch {
            background-color: var(--primary);
        }

        [data-theme="dark"] .toggle-switch::after {
            transform: translateX(20px);
        }

        /* ---------- TOAST (matches chooserole.html) ---------- */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--text-color);
            color: var(--bg-color);
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
            z-index: 200;
            border-left: 4px solid var(--accent);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }
    </style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>


    <header class="site-header" id="siteHeader">
        <div class="header-left">
            <button class="burger-btn" id="burgerBtn" aria-label="Toggle Menu">
                <svg viewBox="0 0 24 24">
                    <line x1="4" y1="7" x2="20" y2="7"></line>
                    <line x1="4" y1="12" x2="20" y2="12"></line>
                    <line x1="4" y1="17" x2="20" y2="17"></line>
                </svg>
            </button>
            <a href="#" class="site-brand">JKJF<span class="dot">.</span></a>
        </div>
        <div class="header-right">
            <button class="header-btn" id="clearAllBtn">Clear All</button>
        </div>
    </header>

    <nav class="menu-drawer" id="menuDrawer">
        <ul class="menu-items">
            <li>
                <button class="menu-item" id="shareBtn">
                    <span>Share Page</span>
                    <svg width="18" height="18" fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>
                </button>
            </li>
            <li>
                <button class="menu-item theme-toggle-btn" id="themeToggleBtn">
                    <span id="themeLabel">Dark Mode</span>
                    <div class="toggle-switch"></div>
                </button>
            </li>
            <li>
                <button class="menu-item" id="clearAllMenuBtn">
                    <span>Clear All Photos</span>
                    <svg width="18" height="18" fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
                </button>
            </li>
        </ul>
    </nav>

    <div class="overlay" id="drawerOverlay"></div>

    <h1 class="page-title">12 Days Document</h1>
    <p class="page-subtitle">August 3 - August 15, 2026</p>

    <div class="grid" id="grid"></div>
    <button class="btn-save" id="saveBtn">Save All Photos</button>

    <div class="toast" id="toastNotification">Link copied to clipboard!</div>

    <script>
        const days = [
            "Aug 3", "Aug 4", "Aug 5", "Aug 6", "Aug 7", "Aug 8",
            "Aug 9", "Aug 10", "Aug 11", "Aug 12", "Aug 13", "Aug 14", "Aug 15"
        ];
        const grid = document.getElementById('grid');

        days.forEach((day, index) => {
            const box = document.createElement('div');
            box.className = 'day-box';
            box.innerHTML = `
                <div class="day-title">${day}</div>
                <label class="upload-area" for="upload${index}">
                    <span class="upload-text" id="text${index}">Click to Upload Photo</span>
                    <img id="preview${index}" style="display:none;">
                    <input type="file" id="upload${index}" accept="image/*" onchange="previewImage(event, ${index})">
                </label>
                <input type="text" class="caption" id="caption${index}" placeholder="Add caption here...">
            `;
            grid.appendChild(box);
        });

        function previewImage(event, index) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById(`preview${index}`).src = e.target.result;
                    document.getElementById(`preview${index}`).style.display = 'block';
                    document.getElementById(`text${index}`).style.display = 'none';
                    localStorage.setItem(`img${index}`, e.target.result);
                }
                reader.readAsDataURL(file);
            }
        }

        function saveData() {
            days.forEach((day, index) => {
                const caption = document.getElementById(`caption${index}`).value;
                localStorage.setItem(`caption${index}`, caption);
            });
            showToast('Saved! Pictures and captions are saved in your browser.');
        }

        function clearAll() {
            if (confirm('Delete all photos and captions?')) {
                localStorage.clear();
                location.reload();
            }
        }

        window.onload = function() {
            days.forEach((day, index) => {
                const savedImg = localStorage.getItem(`img${index}`);
                const savedCap = localStorage.getItem(`caption${index}`);
                if (savedImg) {
                    document.getElementById(`preview${index}`).src = savedImg;
                    document.getElementById(`preview${index}`).style.display = 'block';
                    document.getElementById(`text${index}`).style.display = 'none';
                }
                if (savedCap) {
                    document.getElementById(`caption${index}`).value = savedCap;
                }
            });
        }

        document.getElementById('saveBtn').addEventListener('click', saveData);
        document.getElementById('clearAllBtn').addEventListener('click', clearAll);
        document.getElementById('clearAllMenuBtn').addEventListener('click', () => {
            toggleMenu();
            clearAll();
        });

        const burgerBtn = document.getElementById('burgerBtn');
        const menuDrawer = document.getElementById('menuDrawer');
        const drawerOverlay = document.getElementById('drawerOverlay');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeLabel = document.getElementById('themeLabel');
        const shareBtn = document.getElementById('shareBtn');
        const toast = document.getElementById('toastNotification');
        const siteHeader = document.getElementById('siteHeader');

        function toggleMenu() {
            menuDrawer.classList.toggle('open');
            drawerOverlay.classList.toggle('active');
        }

        burgerBtn.addEventListener('click', toggleMenu);
        drawerOverlay.addEventListener('click', toggleMenu);

        document.addEventListener('click', (e) => {
            if (menuDrawer.classList.contains('open') &&
                !menuDrawer.contains(e.target) &&
                !burgerBtn.contains(e.target)) {
                toggleMenu();
            }
        });

        /* THEME: honors system light/dark by default, but remembers a manual choice */
        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
            themeLabel.textContent = theme === 'dark' ? 'Dark Mode' : 'Light Mode';
        }

        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)');
        const storedTheme = localStorage.getItem('docTheme');
        applyTheme(storedTheme || (systemPrefersDark.matches ? 'dark' : 'light'));

        systemPrefersDark.addEventListener('change', (e) => {
            if (!localStorage.getItem('docTheme')) {
                applyTheme(e.matches ? 'dark' : 'light');
            }
        });

        themeToggleBtn.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            localStorage.setItem('docTheme', newTheme);
            applyTheme(newTheme);
        });

        /* Header divider line — appears once you scroll past the top */
        window.addEventListener('scroll', () => {
            if (window.scrollY > 12) siteHeader.classList.add('scrolled');
            else siteHeader.classList.remove('scrolled');
        }, { passive: true });

        shareBtn.addEventListener('click', async () => {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'JKJF Documentation',
                        url: window.location.href
                    });
                } catch (err) {}
            } else {
                navigator.clipboard.writeText(window.location.href);
                showToast('Link copied to clipboard!');
            }
            toggleMenu();
        });

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
    </html>
