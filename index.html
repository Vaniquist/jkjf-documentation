<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12 Days Documentation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>

        :root {
            --primary: #2563EB;
            --secondary: #0D9488;
            --accent: #F59E0B;
            --bg-color: #F4F5F7;
            --text-color: #1E293B;
            --card-bg: #FFFFFF;
            --card-border: #E2E8F0;
            --header-bg: transparent;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --drawer-bg: #FFFFFF;
            --overlay-bg: rgba(0, 0, 0, 0.4);
            --btn-bg: #E2E8F0;
            --btn-hover: #CBD5E1;
            --header-glass: rgba(255, 255, 255, 0.82);
            --accent-gradient-1: linear-gradient(135deg, var(--primary) 0%, #1D4ED8 100%);
            --accent-gradient-2: linear-gradient(135deg, var(--secondary) 0%, #0F766E 100%);
        }

        [data-theme="dark"] {
            --primary: #3B82F6;
            --secondary: #14B8A6;
            --accent: #FBBF24;
            --bg-color: #070C1B;
            --text-color: #F1F5F9;
            --card-bg: #101A30;
            --card-border: #16223C;
            --header-bg: transparent;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            --drawer-bg: #101A30;
            --overlay-bg: rgba(0, 0, 0, 0.6);
            --btn-bg: #16223C;
            --btn-hover: #2C3B5C;
            --header-glass: rgba(7, 12, 27, 0.82);
            --accent-gradient-1: linear-gradient(135deg, var(--primary) 0%, #2563EB 100%);
            --accent-gradient-2: linear-gradient(135deg, var(--secondary) 0%, #0D9488 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            padding: 100px 24px 60px 24px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.35;
            pointer-events: none;
            animation: float 14s ease-in-out infinite;
        }
        [data-theme="dark"] .blob { opacity: 0.28; }

        .blob-1 { width: 340px; height: 340px; top: -120px; right: -100px; background: var(--primary); }
        .blob-2 { width: 300px; height: 300px; bottom: -100px; left: -100px; background: var(--secondary); animation-delay: -5s; }
        .blob-3 { width: 220px; height: 220px; bottom: 20%; right: -80px; background: var(--accent); opacity: 0.22; animation-delay: -9s; }
        [data-theme="dark"] .blob-3 { opacity: 0.16; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-16px, 22px) scale(1.06); }
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* ---------- HEADER (matches jobs.html / personnel.html) ---------- */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 30px;
            background-color: var(--header-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 90;
            border-bottom: 1px solid transparent;
            transition: background-color 0.25s ease, border-color 0.25s ease, backdrop-filter 0.25s ease;
        }

        .site-header.scrolled {
            background-color: var(--header-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--card-border);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .site-brand {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 23px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--text-color) 0%, var(--text-color) 60%, var(--primary) 130%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.03em;
            text-decoration: none;
        }

        .site-brand .dot {
            color: var(--accent);
            -webkit-text-fill-color: var(--accent);
            font-size: 24px;
            display: inline-block;
            animation: pulse-dot 2.4s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.35); opacity: 0.7; }
        }

        .burger-btn {
            width: 42px;
            height: 42px;
            background-color: var(--btn-bg);
            border: none;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-color);
            transition: background-color 0.2s ease;
        }

        .burger-btn:hover {
            background-color: var(--btn-hover);
        }

        .burger-btn svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
        }

        /* On narrow screens let the header wrap if the logo text runs
           long, instead of clipping. */
        @media (max-width: 480px) {
            .site-header {
                height: auto;
                flex-wrap: wrap;
                row-gap: 10px;
                padding: 14px 20px;
            }
            .site-brand { font-size: 1.15rem; }
            body { padding-top: 128px; padding-left: 14px; padding-right: 14px; }
            .timeline { padding-left: 40px; }
            .timeline::before { left: 15px; }
            .timeline-dot { left: -40px; width: 32px; height: 32px; font-size: 12px; }
            .day-box { padding: 14px 16px; }
        }

        /* Wider screens get a bit more breathing room instead of staying
           pinned to the same narrow phone-width column. */
        @media (min-width: 900px) {
            .timeline { max-width: 760px; padding-left: 64px; }
            .timeline::before { left: 23px; }
            .timeline-dot { left: -64px; width: 44px; height: 44px; font-size: 15px; }
            .day-box { padding: 22px 26px; }
            .caption-body { font-size: 15px; }
        }

        /* ---------- PAGE TITLE ---------- */
        .page-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(26px, 5vw, 36px);
            font-weight: 800;
            text-align: center;
            letter-spacing: -0.02em;
            color: var(--text-color);
            margin-bottom: 8px;
        }

        .page-subtitle {
            text-align: center;
            color: var(--secondary);
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 40px;
        }

        /* ---------- DAY GRID ---------- */
        /* ---------- TIMELINE ---------- */
        .timeline {
            position: relative;
            max-width: 680px;
            margin: 0 auto;
            padding-left: 52px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 19px;
            top: 6px;
            bottom: 6px;
            width: 2px;
            background: linear-gradient(var(--primary), var(--secondary), var(--accent));
            opacity: 0.5;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 28px;
        }

        .timeline-dot {
            position: absolute;
            left: -52px;
            top: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 800;
            font-size: 14px;
            box-shadow: var(--shadow-sm);
            border: 3px solid var(--bg-color);
        }

        .day-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 18px 20px;
            box-shadow: var(--shadow-sm);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .day-box:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .day-title {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--secondary);
            margin-bottom: 10px;
        }

        /* Hidden by default — only shown once a real photo exists and
           successfully loads, so pages without photos yet don't show a
           string of empty placeholder boxes. */
        .upload-area {
            width: 100%;
            height: 200px;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .upload-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .caption-text {
            width: 100%;
        }

        .caption-heading {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 15px;
            color: var(--primary);
            letter-spacing: -0.01em;
            margin-bottom: 6px;
            line-height: 1.35;
        }

        .caption-body {
            font-size: 14px;
            line-height: 1.65;
            color: var(--text-color);
            opacity: 0.82;
            text-align: left;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        /* ---------- BURGER DRAWER (matches chooserole.html exactly) ---------- */
        .menu-drawer {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100%;
            background-color: var(--drawer-bg);
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.2);
            z-index: 200;
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-drawer.open {
            left: 0;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--overlay-bg);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .menu-items {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-radius: 12px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: transparent;
            border: none;
            width: 100%;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .menu-item:hover {
            background-color: var(--btn-bg);
        }

        .menu-item svg {
            stroke: var(--text-color);
            transition: stroke 0.2s ease;
        }

        .theme-toggle-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toggle-switch {
            width: 44px;
            height: 24px;
            background-color: var(--btn-bg);
            border-radius: 20px;
            position: relative;
            transition: background-color 0.3s ease;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: #FFFFFF;
            transition: transform 0.3s ease;
        }

        [data-theme="dark"] .toggle-switch {
            background-color: var(--primary);
        }

        [data-theme="dark"] .toggle-switch::after {
            transform: translateX(20px);
        }

        /* ---------- TOAST (matches chooserole.html) ---------- */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--text-color);
            color: var(--bg-color);
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
            z-index: 200;
            border-left: 4px solid var(--accent);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }
    </style>
</head>

<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <header class="site-header" id="siteHeader">
        <div class="header-left">
            <button class="burger-btn" id="burgerBtn" aria-label="Toggle Menu">
                <svg viewBox="0 0 24 24">
                    <line x1="4" y1="7" x2="20" y2="7"></line>
                    <line x1="4" y1="12" x2="20" y2="12"></line>
                    <line x1="4" y1="17" x2="20" y2="17"></line>
                </svg>
            </button>
            <a href="#" class="site-brand">JKJF<span class="dot">.</span></a>
        </div>
    </header>

    <nav class="menu-drawer" id="menuDrawer">
        <ul class="menu-items">
            <li>
                <button class="menu-item" id="shareBtn">
                    <span>Share Page</span>
                    <svg width="18" height="18" fill="none" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8M16 6l-4-4-4 4M12 2v13"/>
                    </svg>
                </button>
            </li>
            <li>
                <button class="menu-item theme-toggle-btn" id="themeToggleBtn">
                    <span id="themeLabel">Dark Mode</span>
                    <div class="toggle-switch"></div>
                </button>
            </li>
        </ul>
    </nav>

    <div class="overlay" id="drawerOverlay"></div>

    <h1 class="page-title">12 Days Document</h1>
    <p class="page-subtitle">A day-by-day log of building JKJF Job Hunt</p>

    <div class="timeline" id="grid"></div>

    <h2 class="page-title" style="margin-top:60px; font-size: clamp(22px, 4.5vw, 30px);">Website Flowchart</h2>
    <p class="page-subtitle">How JKJF Job Hunt flows from login to application</p>
    <div style="max-width: 760px; margin: 0 auto; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 16px; box-shadow: var(--shadow-sm);">
        <img src="flowchart.jpg" alt="JobHunt Website Flowchart" style="width:100%; border-radius: 12px; display: block;">
    </div>

    <div class="toast" id="toastNotification">Link copied to clipboard!</div>

    <script>
        const days = [
            "Day 1", "Day 2", "Day 3", "Day 4", "Day 5", "Day 6",
            "Day 7", "Day 8", "Day 9", "Day 10", "Day 11", "Day 12"
        ];

        /* Image sources — must be files hosted in this same repo under
           an /images folder (e.g. images/day01.jpg), NOT a local
           file:// path off your phone. A file:// path only exists on
           the one device that created it; nobody visiting the live
           Netlify site (including you, once it's live) can reach it.
           Upload each day's photo to /images alongside your other site
           files, named to match the list below, and it'll show up
           automatically — no other code changes needed. */
        const images = [
            "day1.jpeg",
            "day2.jpeg",
            "day3.jpeg",
            "day4.png",
            "day5.png",
            "day6.jpeg",
            "day7.png",
            "day8.png",
            "day9.png",
            "day10.png",
            "day11.jpeg",
            "day12.jpeg"
        ];

        const captions = [
            "Our group came together to plan the website that we wanted to build. We chose JobHunt - a website where job seekers can look for jobs and employers can find employees",
            "Ken illustrated and designed the raw layout of the website on paper. We made the homepage, job listings page, and personnel page.",
            `Login and Registration System
We coded the user login and registration. We used Supabase to make the sign-up for users and companies secure.`,
            "We started coding the database using Supabase. We created tables for job seekers, companies, and jobs.",
            "We began coding and tested if the database was working. We inserted sample data and the saving and retrieving of data worked.",
            `Frontend Coding Homepage
We started coding the frontend. We made the homepage with a login page. And the next page lets you choose your role.`,
            "We made the personnel page. Here employers can look for employees' profile and see who's fit for their company",
            "We made it so employers/companies can also post job offerings of their own, which the job seekers can apply to ",
            "We made the Contact button. When a user applies, the application with resume and details is saved in the database. The company also gets notified.",
            `Demo Post
Freyzsa gathered sample pictures and information to be used as our demo.`,
            `Final Testing and debugging
We did bug testing on the whole website.`,
            "We are now finalizing our output and we are studying each part. We also studied the proper sequence of each part and how it works."
        ];

        const grid = document.getElementById('grid');

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Some captions are written as "Title line \n body text" and some
        // are just a plain sentence. Rendering the whole thing as one
        // plain-text blob collapses the line break, so a title and its
        // body run together as one paragraph. Splitting them here gives
        // the title its own bold line and the body its own paragraph.
        function renderCaption(raw) {
            const lines = String(raw || '').split('\n').map(l => l.trim()).filter(Boolean);
            if (lines.length === 0) return '';
            if (lines.length === 1) {
                return `<div class="caption-body">${escapeHtml(lines[0])}</div>`;
            }
            const heading = escapeHtml(lines[0]);
            const body = escapeHtml(lines.slice(1).join(' '));
            return `<div class="caption-heading">${heading}</div><div class="caption-body">${body}</div>`;
        }

        const dotColors = ['var(--primary)', 'var(--secondary)', 'var(--accent)'];

        days.forEach((day, index) => {
            const item = document.createElement('div');
            item.className = 'timeline-item';
            item.innerHTML = `
                <div class="timeline-dot" style="background:${dotColors[index % dotColors.length]}">${index + 1}</div>
                <div class="day-box">
                    <div class="day-title">${day}</div>
                    <div class="upload-area" id="area${index}" style="display:none;">
                        <img id="preview${index}" alt="${day}">
                    </div>
                    <div class="caption-text" id="caption${index}"></div>
                </div>
            `;

            const area = item.querySelector(`#area${index}`);
            const img = item.querySelector(`#preview${index}`);
            const caption = item.querySelector(`#caption${index}`);

            const src = images[index];
            if (src) {
                // Only reveal the image slot once the photo actually
                // exists and loads — until then it stays hidden, so a
                // day without a photo yet doesn't leave an empty box.
                img.onload = () => { area.style.display = 'block'; };
                img.onerror = () => { area.style.display = 'none'; };
                img.src = src;
            }

            caption.innerHTML = renderCaption(captions[index]);

            grid.appendChild(item);
        });

        const burgerBtn = document.getElementById('burgerBtn');
        const menuDrawer = document.getElementById('menuDrawer');
        const drawerOverlay = document.getElementById('drawerOverlay');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeLabel = document.getElementById('themeLabel');
        const shareBtn = document.getElementById('shareBtn');
        const toast = document.getElementById('toastNotification');
        const siteHeader = document.getElementById('siteHeader');

        function toggleMenu() {
            menuDrawer.classList.toggle('open');
            drawerOverlay.classList.toggle('active');
        }

        burgerBtn.addEventListener('click', toggleMenu);
        drawerOverlay.addEventListener('click', toggleMenu);

        document.addEventListener('click', (e) => {
            if (menuDrawer.classList.contains('open') &&
                !menuDrawer.contains(e.target) &&
                !burgerBtn.contains(e.target)) {
                toggleMenu();
            }
        });

        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }

            themeLabel.textContent = theme === 'dark' ? 'Dark Mode' : 'Light Mode';
        }

        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)');
        const storedTheme = localStorage.getItem('docTheme');
        applyTheme(storedTheme || (systemPrefersDark.matches ? 'dark' : 'light'));

        systemPrefersDark.addEventListener('change', (e) => {
            if (!localStorage.getItem('docTheme')) {
                applyTheme(e.matches ? 'dark' : 'light');
            }
        });

        function switchTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            localStorage.setItem('docTheme', newTheme);
            applyTheme(newTheme);
        }

        themeToggleBtn.addEventListener('click', () => {
            switchTheme();
            toggleMenu();
        });

        shareBtn.addEventListener('click', async () => {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'JKJF Documentation',
                        url: window.location.href
                    });
                } catch (err) {}
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(window.location.href);
                showToast('Link copied to clipboard!');
            }
            toggleMenu();
        });

        window.addEventListener('scroll', () => {
            if (window.scrollY > 12) siteHeader.classList.add('scrolled');
            else siteHeader.classList.remove('scrolled');
        }, { passive: true });

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
    </html>
